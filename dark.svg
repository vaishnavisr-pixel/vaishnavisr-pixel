    <circle cx="25" cy="22" r="6" fill="#EF4444"/><circle cx="45" cy="22" r="6" fill="#F59E0B"/><circle cx="65" cy="22" r="6" fill="#10B981"/>
    <text x="310" y="26" font-family="monospace" font-size="13" fill="#94A3B8" text-anchor="middle">developer@terminal:~</text>

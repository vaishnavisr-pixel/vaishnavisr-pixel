<svg xmlns="http://.w3.org" viewBox="0 0 1180 610" width="100%" height="100%">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"><animate attributeName="stop-color" values="#7C3AED;#22D3EE;#10B981;#7C3AED" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="50%" stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#10B981;#7C3AED;#22D3EE" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#10B981"><animate attributeName="stop-color" values="#10B981;#7C3AED;#22D3EE;#10B981" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="asciiGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#7C3AED"/></linearGradient>
    <clipPath id="avatarClip"><circle cx="200" cy="225" r="90" /></clipPath>
    <clipPath id="typeClip"><rect x="535" y="160" height="40" width="0"><animate attributeName="width" values="0;0;320;320;0;0" dur="10s" repeatCount="indefinite" keyTimes="0;0.05;0.45;0.55;0.95;1"/></clipPath>
  </defs>
  <rect width="1180" height="610" rx="24" fill="#030712" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="200" cy="200" r="280" fill="#7C3AED" fill-opacity="0.12"><animate attributeName="cx" values="200;260;140;200" dur="12s" repeatCount="indefinite"/></circle>
  <circle cx="950" cy="450" r="320" fill="#22D3EE" fill-opacity="0.08"><animate attributeName="cy" values="450;510;380;450" dur="15s" repeatCount="indefinite"/></circle>
  <g transform="translate(60, 80)">
    <animateTransform attributeName="transform" type="translate" values="60,80; 60,72; 60,80" dur="6s" repeatCount="indefinite" additive="sum"/>
    <rect width="400" height="450" rx="16" fill="#0F172A" fill-opacity="0.75" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <rect width="400" height="450" rx="16" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.4"/>
    <circle cx="200" cy="225" r="95" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0 200 225" to="360 200 225" dur="10s" repeatCount="indefinite"/>
    </circle>
    
    <!-- PLACE YOUR PROFILE PICTURE LINK IN THE HREF BELOW -->
    <image href="https://github.com/vaishnavisr-pixel/vaishnavi-pixel/blob/main/myphoto.jpg?raw=true" x="110" y="135" width="180" height="180" clip-path="url(#avatarClip)" />
    <g font-family="monospace" font-size="11" xml:space="preserve" fill="url(#asciiGrad)">
      <text x="35" y="55" opacity="0">&gt;_ SYS.INIT: INITIALIZED<animate attributeName="opacity" to="1" begin="0.3s" fill="freeze"/></text>
      <text x="35" y="375" opacity="0">&gt;_ IDENTITY LINK: CONNECTED [OK]<animate attributeName="opacity" to="1" begin="0.8s" fill="freeze"/></text>
      <text x="35" y="400" opacity="0">&gt; SECURE_TUNNEL // 127.0.0.1<animate attributeName="opacity" to="1" begin="1.1s" fill="freeze"/></text>
    </g>
  </g>
  <g transform="translate(500, 80)">

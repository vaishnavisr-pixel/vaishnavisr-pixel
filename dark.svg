      <text x="35" y="130" font-size="36" font-weight="800" fill="#F8FAFC">I'm <tspan fill="url(#accentGrad)">VAISHNAVI</tspan></text>
      <g font-family="monospace" font-size="20" font-weight="600" fill="#22D3EE">
        <g clip-path="url(#typeClip)"><text x="35" y="185">&gt;_ Computer Science Engineer</text><animate attributeName="display" values="block;none;none;block" dur="10s" repeatCount="indefinite" keyTimes="0;0.49;0.99;1"/></g>
        <g clip-path="url(#typeClip)"><text x="35" y="185">&gt;_ Open Source Contributor</text><animate attributeName="display" values="none;block;none;none" dur="10s" repeatCount="indefinite" keyTimes="0;0.50;0.99;1"/></g>
        <rect x="35" y="167" width="10" height="22" fill="#22D3EE"><animate attributeName="x" values="35;35;290;290;35;35" dur="10s" repeatCount="indefinite" keyTimes="0;0.05;0.45;0.55;0.95;1"/><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
      </g>
      <g font-size="14" fill="#94A3B8" transform="translate(35, 220)">
        <g opacity="0"><animate attributeName="opacity" to="1" begin="1.3s" fill="freeze"/><text x="0" y="0" font-weight="600" fill="#7C3AED">📍 Location:</text><text x="110" y="0" fill="#F8FAFC">Kollam, Kerala, India</text></g>
        <g opacity="0"><animate attributeName="opacity" to="1" begin="1.5s" fill="freeze"/><text x="0" y="25" font-weight="600" fill="#7C3AED">🚀 Focus:</text><text x="110" y="25" fill="#F8FAFC">Next.js, Cloud Solutions</text></g>
      </g>
      <text x="35" y="320" font-size="14" font-weight="700" fill="#F8FAFC" letter-spacing="1">TECH STACK</text>
      <g transform="translate(35, 335)" font-size="12" font-weight="600">
        <g transform="translate(0,0)"><rect width="65" height="26" rx="13" fill="#1E293B"/><text x="32.5" y="17" fill="#F8FAFC" text-anchor="middle">React</text></g>
        <g transform="translate(75,0)"><rect width="75" height="26" rx="13" fill="#1E293B" stroke="url(#accentGrad)" stroke-width="1"/><text x="37.5" y="17" fill="#F8FAFC" text-anchor="middle">Next.js</text></g>
        <g transform="translate(160,0)"><rect width="75" height="26" rx="13" fill="#1E293B"/><text x="37.5" y="17" fill="#F8FAFC" text-anchor="middle">Node.js</text></g>
        <g transform="translate(245,0)"><rect width="95" height="26" rx="13" fill="#1E293B"/><text x="47.5" y="17" fill="#F8FAFC" text-anchor="middle">TypeScript</text></g>
